plugins {
    id 'net.minecraftforge.gradle'
}

version = rootProject.version
group = rootProject.group

base {
    archivesName = 'toneko-forge'
}

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version
    copyIdeResources = true
}

sourceSets {
    main {
        java {
            srcDirs('../common/src/main/java', 'src/main/java')
            // EMI is a Fabric-only recipe viewer integration. Forge support will
            // be added through its own optional adapter instead of shipping the
            // Fabric entrypoint in a Forge JAR.
            exclude 'org/cneko/toneko/common/mod/client/emi/**'
            exclude 'org/cneko/toneko/common/mod/recipes/emi/**'
            // Development-only Fabric client command; no game content depends on it.
            exclude 'org/cneko/gal/common/client/TestGalCommand.java'
        }
        resources.srcDirs('../common/src/main/resources', 'src/main/resources')
    }
}

repositories {
    // Forge declares MergeTool transitively. Keep a Maven-shaped local cache so
    // that Gradle can resolve the original coordinate when working offline.
    maven { url = uri('local-maven') }
    flatDir { dirs 'libs' }
    mavenCentral()
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    implementation fg.deobf("local.geckolib:geckolib-forge-${rootProject.minecraft_version}:${rootProject.geckolib_version}")
    implementation fg.deobf('local.architectury:architectury-forge:9.2.14')
    implementation fg.deobf('local.architectury:architectury:9.2.14')
    compileOnly 'local.architectury:architectury-injectables:1.0.10'
    // Temporary bridge while Forge-native event replacements are migrated.
    // The public FFAPI release is cached locally because its Maven host is
    // unreliable in this development environment.
    implementation fg.deobf('local.ffapi:fabric-api:0.92.6+1.11.14+1.20.1')
    // Forgified Fabric API ships its modules as jar-in-jar libraries. The
    // aggregate JAR is correct at runtime, but javac must see the modules
    // individually while the remaining API calls are migrated to Forge.
    implementation files(fileTree(dir: 'ffapi-compile', include: '*.jar'))
    implementation 'com.github.CSneko:NekoAI:v0.1.3-alpha'
    implementation 'com.github.umjammer:jlayer:1.0.3'
    compileOnly 'io.netty:netty-codec-http:4.1.117.Final'
    compileOnly 'io.netty:netty-handler-proxy:4.1.117.Final'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'toneko',
                'Specification-Vendor'    : 'CSneko',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version
        ])
    }
}
